<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Guess the Number!!</title>
        <link rel="stylesheet" href="/letsplaymaths/stylefiles/numguessingstyle.css"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1 class="headTitle">Number Guessing Game (easy)</h1>
        <div class="dropdownNum">
            <button class="dropBtn">See Menu</button>
            <nav class="navNum">
                <div class="navGrouping">
                    <a href="/letsplaymaths/index.html">Home</a>
                    <a href="/letsplaymaths/htmlfiles/counter.html">Counter</a>
                    <a href="/letsplaymaths/htmlfiles/randomnumfiles/rannumhome.html">Random Number</a>
                    <a href="/letsplaymaths/htmlfiles/numberguessgame/numguesshome.html">Number Guess Home</a>
                    <a href="/letsplaymaths/htmlfiles/tempconv.html">Temperature Convertor</a>
                </div>
            </nav>
        </div>
        <div class="upper">
            <p id="rules">Rules:-</p>
            <ul>
                <li>>>Choose a value between 0 to 50</li><br>
                <li>>>You will be given only 4 chances</li><br>
                <li>>>Optimize your guesses based on hints</li>
            </ul>
        </div>
        <div class="guessgame">
            <input type="number" name="" id="guessValue" placeholder="Your guess..." min="0" max="50">
            <button class="btn" id="guessBtn">Guess</button>
            <span id="counter">0</span>
            <p id="hint">*do the first guess to get a hint</p>
            <button class="btn" id="restartBtn">Restart</button>
        </div>
        <script src="/letsplaymaths/scriptfiles/numguessscript/numguesseasy.js"></script>
    </body>
</html>
