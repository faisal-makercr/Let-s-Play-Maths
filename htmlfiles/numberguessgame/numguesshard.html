<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Guess the number Hard</title>
        <link rel="stylesheet" href="/letsplaymaths/stylefiles/numguessingstyle.css"/>
    </head>
    <body>
        <h2 id="title">Number Guessing Game (Hard)</h2>
        <div class="upper">
            <p id="rules">Rules:-</p>
            <ul>
                <li>Choose a value between 0 to 500</li>
                <li>You will be given only 8 chances</li>
                <li>Optimise your guesses based on the hints you get <br> after each wrong guess</li>
            </ul>
        </div>
        <div class="guessgame">
            <input type="number" name="" id="guessValue" placeholder="Your guess..." min="0" max="500">
            <button class="btn" id="guessBtn">Guess</button>
            <span id="counter">0</span>
            <p id="hint">*Do the first guess to get a hint</p>
            <button class="btn" id="restartBtn">Restart</button>
        </div>
        <script src="/letsplaymaths/scriptfiles/numguessscript/numguesshard.js"></script>
    </body>
</html>
