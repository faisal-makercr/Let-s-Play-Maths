<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Guess the number Advanced</title>
        <link rel="stylesheet" href="/letsplaymaths/stylefiles/numguessingstyle.css"/>
    </head>
    <body>
        <h2 id="title">Number Guessing Game (Advanced)</h2>
        <div class="upper">
            <p id="rules">Rules:-</p>
            <ul>
                <li>Choose a value between 0 to 1000</li><br>
                <li>You will be given only 10 chances</li><br>
                <li>Optimize your guesses based on hints</li>
            </ul>
        </div>
        <div class="guessgame">
            <input type="number" name="" id="guessValue" placeholder="Your guess.." min="0" max="1000">
            <button class="btn" id="guessBtn">Guess</button>
            <span id="counter">0</span>
            <p id="hint">*do the first guess to get a hint</p>
            <button class="btn" id="restartBtn">Restart</button>
        </div>
        <script src="/letsplaymaths/scriptfiles/numguessscript/numguessadv.js"></script>
    </body>
</html>
