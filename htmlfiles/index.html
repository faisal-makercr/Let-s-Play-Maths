<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fun little maths games</title>
        <link rel="stylesheet" href="/letsplaymaths/stylefiles/style.css"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="mathsym-background" aria-hidden="true">
            <span class="sym s1">𝝅</span>
            <span class="sym s2">7</span>
            <span class="sym s3">+</span>
            <span class="sym s4">∠</span>
            <span class="sym s5">√</span>
            <span class="sym s6">σ</span>
            <span class="sym s7">γ</span>
            <span class="sym s8">Å</span>
            <span class="sym s9">1</span>
            <span class="sym s10">=</span>
            <span class="sym s11">∫</span>
            <span class="sym s12">α</span>
            <span class="sym s13">∏</span>
            <span class="sym s14">η</span>
            <span class="sym s15">%</span>
            <span class="sym s16">∀</span>
            <span class="sym s17">β</span>
            <span class="sym s18">∞</span>
            <span class="sym s19">×</span>
            <span class="sym s20">−</span>
            <span class="sym s21">≈</span>
            <span class="sym s22">6</span>
            <span class="sym s23">0</span>
            <span class="sym s24">∛</span>
            <span class="sym s25">Ω</span>
            <span class="sym s26">∑</span>
            <span class="sym s27">⊆</span>
            <span class="sym s28">÷</span>
            <span class="sym s29">δ</span>
            <span class="sym s30">3</span>
            <span class="sym s31">>></span>
        </div>
        <div class="container">
            <h1>Let's Play Maths!</h1>
            <p>It's better to play with fun simple maths rather than scrolling on socail media</p>
            <section class="section-title">
                <p>Choose which one you want to start</p>
                <button class="clicktosee">Click to see all the options to choose from</button>
            </section>
            <section class="numbergamessec" style="visibility: hidden;">
                <div class="numbergames">
                    <a href="/letsplaymaths/htmlfiles/counter.html"><button id="num">Counter With Control</button></a>
                </div>
                <div class="numbergames">
                    <a href="/letsplaymaths/htmlfiles/randomnumfiles/rannumhome.html"><button id="num">Random Number Generator</button></a>
                </div>
                <div class="numbergames">
                    <a href="/letsplaymaths/htmlfiles/numberguessgame/numguesshome.html"><button id="num">Number Guessing Game</button></a>
                </div>
                <div class="numbergames">
                    <a href="/letsplaymaths/htmlfiles/tempconv.html"><button id="num">Temperature Convertor</button></a>
                </div>
            </section>
        </div>
        <script src="/letsplaymaths/scriptfiles/script.js"></script>
    </body>
</html>
