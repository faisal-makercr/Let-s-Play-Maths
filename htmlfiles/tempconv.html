<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Temperature Converter</title>
        <link rel="stylesheet" href="/letsplaymaths/stylefiles/temperature.css"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1>Temperature Converter!!</h1>

        <div class="inputtempo">
            <input type="number" id="temperature" placeholder="Enter Temperature..."><br>
            <p id="selectpara">Select the type of temperature you entered</p>
            <select class="scaleselect" id="scale">
                <option value="celcius">Celcius (C)</option>
                <option value="fahrenheit">Fahrenheit (F)</option>
                <option value="kalvin">Kelvin (K)</option>
            </select>

            <p class="selectLabel">Select what you want to convert to</p>
            <select class="scaleselect" id="toScale">
                <option value="celsius">Celsius (C)</option>
                <option value="fahrenheit">Fahrenheit (F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <div class="buttons">
            <button id="convertBtn" onclick="ConvertTemperature()">Convert</button>
            <button id="resetBtn" onclick="ResetConverter()">Reset</button>
        </div>

        <div class="result">
            <p id="result"></p>
            <p id="errorMessage"></p>
        </div>
        <script src="/letsplaymaths/scriptfiles/temperature.js"></script>
    </body>
</html>
