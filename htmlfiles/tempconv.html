<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Temperature Converter</title>
        <link rel="stylesheet" href="/letsplaymaths/stylefiles/temperature.css"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1>Temperature Converter!!</h1>
                <div class="dropdownTempo">
            <button class="dropBtn">See Menu</button>
            <nav class="navTempo">
                <div class="navGrouping">
                    <a href="/letsplaymaths/htmlfiles/index.html">Home</a>
                    <a href="/letsplaymaths/htmlfiles/counter.html">Counter</a>
                    <a href="/letsplaymaths/htmlfiles/randomnumfiles/rannumhome.html">Random Number</a>
                    <a href="/letsplaymaths/htmlfiles/numberguessgame/numguesshome.html">Guess Number</a>
                    <a href="/letsplaymaths/htmlfiles/tempconv.html">Temperature Convertor</a>
                </div>
            </nav>
        </div>
        <h2>Wanna convert some temperatures? (idk why I came with line)</h2>
        <div class="inputtempo">
            <input type="number" id="temperature" placeholder="Enter Temperature..."><br>
            <p class="selectLabel">Select the type of unit of entered temperature</p>
            <select class="scaleselect" id="fromScale">
                <option value="celsius">Celsius (C)</option>
                <option value="fahrenheit">Fahrenheit (F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <p class="selectLabel">Select what you want to convert to</p>
            <select class="scaleselect" id="toScale">
                <option value="celsius">Celsius (C)</option>
                <option value="fahrenheit">Fahrenheit (F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <div class="buttons">
            <button id="convertBtn" onclick="convertTemperature()">Convert</button>
            <button id="resetBtn" onclick="resetConverter()">Reset</button>
        </div>

        <div class="result">
            <p id="result1"></p>
            <p id="errorMessage"></p>
        </div>
        <script src="/letsplaymaths/scriptfiles/temperature.js"></script>
    </body>
</html>
