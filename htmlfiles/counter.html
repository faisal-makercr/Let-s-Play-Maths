<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Counter This Number</title>
        <link rel="stylesheet" href="/letsplaymaths/stylefiles/counterstyle.css"/>
    </head>
    <body>
        <label id="counterLabel">0</label><br>
        <div id="stepContainer">
            <label for="stepInput">Step size:</label>
            <input type="number" id="stepInput" value="1" min="1">
        </div>
        <div id="btncontainer">
            <button id="decreaseBtn" class="buttons">Decrease</button>
            <button id="resetBtn" class="buttons">Reset</button>
            <button id="increaseBtn" class="buttons">Increase</button>
            <br>
            <button id="increaseby5Btn" class="buttons">Increase by 5</button>
            <button id="decreaseby5Btn" class="buttons">Decrease by 5</button>
            <br>
            <button id="increaseby10Btn" class="buttons">Increase by 10</button>
            <button id="decreaseby10Btn" class="buttons">Decrease by 10</button>
        </div>
        <script src="/letsplaymaths/scriptfiles/counterscript.js"></script>
    </body>
</html>
